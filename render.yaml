# Render Blueprint for the HireBoard API (free plan).
# Database: Neon free Postgres; paste its connection string as DATABASE_URL when Render asks.
services:
  - type: web
    name: hireboard-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    # --include=dev: NODE_ENV=production would otherwise skip TypeScript, which the build needs.
    buildCommand: npm ci --include=dev && npm run build
    # Apply new database migrations, then start the API.
    startCommand: node dist/db/migrate.js && node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_URL
        value: https://hireboard-mu.vercel.app
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Shared secret for the daily GitHub Actions job (copy it into the repo's Actions secrets).
      - key: CRON_SECRET
        generateValue: true
