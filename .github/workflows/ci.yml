name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hireboard
          POSTGRES_PASSWORD: hireboard
          POSTGRES_DB: hireboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hireboard"
          --health-interval 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://hireboard:hireboard@localhost:5432/hireboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The eval gate: replays recorded model replies (no API key, no network) and fails on
      # a missed target, a drop from evals/reports/metrics.json, an edited prompt that was
      # not re-recorded, or reports/README not regenerated. Results appear in the job summary.
      - name: AI eval gate (replay)
        run: npm run eval
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: ci-only-secret

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
